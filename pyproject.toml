[project]
name = "mcp-winaccess"
version = "1.0.0"
description = "Local MCP server for OpenCode — Windows desktop automation via pyautogui and pywinauto"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
windows = ["pywinauto>=0.6.8", "pywin32>=306"]
linux = ["pyatspi>=2.46.0"]
mac = []

[project.scripts]
mcp-winaccess = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
