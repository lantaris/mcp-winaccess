[project]
name = "mcp-winaccess"
version = "1.1.2"
description = "Local MCP server for OpenCode — Windows desktop automation via pyautogui and pywinauto"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "pyatspi>=2.46.0; sys_platform == 'linux'",
]


[project.scripts]
mcp-winaccess = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
